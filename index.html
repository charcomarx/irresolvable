<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>irresolvable?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;color:#ccc;
  font-family:'Courier New',Courier,monospace;
  font-size:14px;
  line-height:1.3;
  overflow:hidden;
  user-select:none;
}
#wrap{
  display:flex;
  flex-direction:column;
  width:100%;
  height:100%;
}

#title{
  color:#fff;
  white-space:nowrap;
  padding:2px 6px;
  border-bottom:1px solid #333;
  flex-shrink:0;
  font-size:18px;
  letter-spacing:0;
}

#instruction{
  color:#6f6;
  font-size:12px;
  padding:2px 6px;
  border-bottom:1px solid #333;
  flex-shrink:0;
  white-space:nowrap;
}

/* Spacer to clear the large fixed buttons */
#topspacer{
  height:144px;
  flex-shrink:0;
}

#puzzlerow{
  flex-shrink:0;
  white-space:pre;
  font-family:'Courier New',Courier,monospace;
}

#puzzleline{
  font-size:22px;
  letter-spacing:2px;
  color:#fff;
  white-space:pre;
  padding:4px 6px 2px 6px;
  min-height:24px;
  transition:color 0.1s ease;
  font-family:'Courier New',Courier,monospace;
}

#puzzleline.warning{
  color:#f66;
}

#gap{
  flex:1;
  min-height:20px;
}

#answerrow{
  flex-shrink:0;
  white-space:pre;
}

#answerblock{
  flex-shrink:0;
  padding:0 6px 4px 6px;
  overflow-y:auto;
  max-height:45vh;
}

.aline{
  font-size:16px;
  white-space:nowrap;
  line-height:1.3;
  margin:2px 0;
  font-family:'Courier New',Courier,monospace;
}

.aline.correct{
  color:#6f6;
}

.aline.incorrect{
  color:#f66;
}

.aline a{
  text-decoration:none;
  border-bottom:1px solid;
}

.aline.correct a{
  color:#6f6;
  border-bottom-color:#3a3;
}

.aline.incorrect a{
  color:#f66;
  border-bottom-color:#a33;
}

.aline a:hover{
  color:#aff;
}

#status{
  flex-shrink:0;
  font-size:11px;
  color:#383838;
  padding:1px 6px;
  border-top:1px solid #111;
  background:#050505;
}

#gameover{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  align-items:center;
  justify-content:center;
  z-index:99;
}

#gotext{
  color:#fff;
  font-size:22px;
  letter-spacing:3px;
  animation:gb .5s step-end infinite;
}

@keyframes gb{
  50%{opacity:0}
}

@keyframes flash{
  0%,100%{opacity:1}
  25%,75%{opacity:0}
}

.flashing{
  animation:flash .9s steps(1) forwards;
}

/* TRIPLE SIZE Top right controls: Score + Y/N buttons */
#topright{
  position:fixed;
  top:2px;
  right:4px;
  display:flex;
  gap:12px;
  align-items:center;
  z-index:100;
}

#scorebox{
  background:#111;
  color:#ccc;
  border:2px solid #333;
  font-family:'Courier New',Courier,monospace;
  font-size:48px;
  font-weight:bold;
  width:80px;
  height:90px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

#scorebox.positive{
  color:#6f6;
  border-color:#3a3;
}

#scorebox.negative{
  color:#f66;
  border-color:#a33;
}

#scorebox.zero{
  color:#fff;
  border-color:#333;
}

#buttons{
  display:flex;
  gap:12px;
}

#buttons button{
  background:#111;
  color:#ccc;
  border:2px solid #333;
  font-family:'Courier New',Courier,monospace;
  font-size:48px;
  font-weight:bold;
  width:120px;
  height:90px;
  border-radius:8px;
  cursor:pointer;
  transition:all 0.1s ease;
  touch-action:manipulation;
}

#buttons button:active{
  background:#333;
  color:#fff;
  transform:scale(0.96);
}

/* Mobile adjustments */
@media (max-width: 600px){
  #topspacer{
    height:120px;
  }
  #title{
    font-size:14px;
    padding-right:100px;
  }
  #puzzleline{
    font-size:18px;
    letter-spacing:1px;
  }
  .aline{
    font-size:14px;
  }
  #scorebox{
    width:60px;
    height:70px;
    font-size:36px;
  }
  #buttons button{
    width:80px;
    height:70px;
    font-size:36px;
  }
}
</style>
</head>
<body>

<!-- Top right controls: Score + Y/N buttons (TRIPLE SIZE) -->
<div id="topright">
  <div id="scorebox">0</div>
  <div id="buttons">
    <button id="btnY">Y</button>
    <button id="btnN">N</button>
  </div>
</div>

<div id="wrap">
  <div id="title">irresolvable? [Y/N]</div>
  <div id="topspacer" style="height:144px; flex-shrink:0;"></div>
  <div id="instruction">what's a word? what's not? enter Y / N</div>
  <div id="topspacer"></div>
  <div id="puzzlerow"></div>
  <div id="puzzleline"></div>
  <div id="gap"></div>
  <div id="answerrow"></div>
  <div id="answerblock"></div>
  <div id="status">loading Scrabble dictionary...</div>
</div>

<div id="gameover">
  <div id="gotext">irresolvable?</div>
</div>

<script>
var dict = [];
var puzzle = '', answers = [];

var score    = 0;
var tabLevel = 0;
var rowPad   = 0;
var locked   = false;

// Mobile detection for tabs
var isMobile = window.innerWidth <= 600;
var MAX_TABS = isMobile ? 5 : 9;
var TAB_SP   = isMobile ? 2 : 4;

var answerHistory = [];

var titleEl    = document.getElementById('title');
var puzzleRowEl= document.getElementById('puzzlerow');
var puzzleEl   = document.getElementById('puzzleline');
var gapEl      = document.getElementById('gap');
var answerRowEl= document.getElementById('answerrow');
var answerEl   = document.getElementById('answerblock');
var statusEl   = document.getElementById('status');
var gameoverEl = document.getElementById('gameover');
var scoreBox   = document.getElementById('scorebox');

function updateScoreDisplay(){
  if(score > 0){
    scoreBox.textContent = '' + score;
    scoreBox.className = 'positive';
  } else if(score < 0){
    scoreBox.textContent = '!';
    scoreBox.className = 'negative';
  } else {
    scoreBox.textContent = '0';
    scoreBox.className = 'zero';
  }
}

function renderPuzzle(){
  var prefix = '';
  for(var i = 0; i < tabLevel * TAB_SP; i++) prefix += ' ';
  puzzleEl.textContent = prefix + puzzle;
  
  if(tabLevel >= 1){
    puzzleEl.classList.add('warning');
  } else {
    puzzleEl.classList.remove('warning');
  }
}

function applyRowPad(){
  var pad = rowPad > 0 ? '\n'.repeat(rowPad) : '';
  puzzleRowEl.textContent = pad;
  answerRowEl.textContent = pad;
}

function addAnswer(text, link, wasCorrect){
  answerHistory.unshift({text: text, link: link || null, correct: wasCorrect});
  renderAnswers();
}

function renderAnswers(){
  answerEl.innerHTML = '';
  var gapH  = gapEl.clientHeight;
  var lineH = (puzzleEl.clientHeight || 22) * 1.2;
  var max   = Math.max(1, Math.floor(gapH / lineH));
  var show  = answerHistory.slice(0, max);
  for(var i = 0; i < show.length; i++){
    var entry = show[i];
    var d = document.createElement('div');
    d.className = 'aline ' + (entry.correct ? 'correct' : 'incorrect');
    if(entry.link){
      var a = document.createElement('a');
      a.href = entry.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = entry.text;
      d.appendChild(a);
    } else {
      d.textContent = entry.text;
    }
    answerEl.appendChild(d);
  }
}

function setStatus(t){ statusEl.textContent = t; }

function availableLines(){
  var wrapH  = document.getElementById('wrap').clientHeight;
  var titleH = titleEl.clientHeight;
  var statH  = document.getElementById('status').clientHeight;
  var lineH  = puzzleEl.clientHeight || 22;
  return Math.floor((wrapH - titleH - statH) / lineH);
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var x=arr[i];arr[i]=arr[j];arr[j]=x;
  }
  return arr;
}

function findAnswers(pattern){
  try{
    var re = new RegExp('^' + pattern.toLowerCase().replace(/_/g,'[a-z]') + '$');
    var matches = [];
    for(var i = 0; i < dict.length && matches.length < 12; i++){
      if(re.test(dict[i])) matches.push(dict[i]);
    }
    return matches;
  } catch(e){ return []; }
}

// Generate IMPOSSIBLE puzzle - ONLY returns patterns with 0 dictionary matches
function generateImpossible(){
  for(var attempt = 0; attempt < 500; attempt++){
    // Pick a random real word
    var baseWord = dict[Math.floor(Math.random() * dict.length)];
    if(!baseWord || baseWord.length < 4 || baseWord.length > 7) continue;
    
    var chars = baseWord.split('');
    
    // CORRUPT: change one letter to create a non-word
    var pos = Math.floor(Math.random() * chars.length);
    var originalChar = chars[pos];
    var newChar;
    
    if('aeiou'.indexOf(originalChar) !== -1){
      var vowels = ['a','e','i','o','u'];
      var others = vowels.filter(function(v){ return v !== originalChar; });
      if(others.length === 0) continue;
      newChar = others[Math.floor(Math.random() * others.length)];
    } else {
      var consonants = 'bcdfghklmnpqrstvwxyz'.split('');
      var otherConsonants = consonants.filter(function(c){ return c !== originalChar; });
      if(otherConsonants.length === 0) continue;
      newChar = otherConsonants[Math.floor(Math.random() * otherConsonants.length)];
    }
    chars[pos] = newChar;
    
    // Blank out 1-2 positions
    var blankCount = 1 + Math.floor(Math.random() * Math.min(2, chars.length - 2));
    var positions = [];
    for(var i = 0; i < chars.length; i++) positions.push(i);
    positions = shuffle(positions).slice(0, blankCount);
    for(var i = 0; i < positions.length; i++){
      chars[positions[i]] = '_';
    }
    
    var pattern = chars.join('').toUpperCase();
    var matches = findAnswers(pattern);
    
    // ONLY accept if ZERO matches in dictionary
    if(matches.length === 0){
      return pattern;
    }
  }
  
  // Ultimate fallback - verified impossible (single pattern only)
  return '_X_Z_Q_';
}

// Generate SOLVABLE puzzle - returns patterns with 1-4 dictionary matches
function generateSolvable(){
  for(var attempt = 0; attempt < 300; attempt++){
    var word = dict[Math.floor(Math.random() * dict.length)];
    if(!word || word.length < 4 || word.length > 7) continue;
    
    var blankCount = 1 + (Math.random() < 0.3 ? 2 : 1);
    blankCount = Math.min(blankCount, word.length - 2);
    
    var chars = word.split('');
    var positions = [];
    for(var i = 0; i < chars.length; i++) positions.push(i);
    positions = shuffle(positions).slice(0, blankCount);
    for(var i = 0; i < positions.length; i++){
      chars[positions[i]] = '_';
    }
    
    var pattern = chars.join('').toUpperCase();
    var matches = findAnswers(pattern);
    
    // Sweet spot: 1-4 possible answers
    if(matches.length >= 1 && matches.length <= 4){
      return {pat: pattern, ans: matches};
    }
  }
  
  // Fallback solvable patterns (all verified to have matches)
  var fallbacks = [
    {pat: 'H_RSE', ans: ['horse','house','mouse']},
    {pat: 'B_RD', ans: ['bird','bard','bord']},
    {pat: 'C_T', ans: ['cat','cot','cut']},
    {pat: 'ST_NE', ans: ['stone','stane','stine']}
  ];
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

function newPuzzle(){
  if(dict.length === 0){
    setTimeout(newPuzzle, 100);
    return;
  }
  
  // 70% solvable, 30% impossible
  var isImpossible = Math.random() < 0.3;
  
  if(isImpossible){
    puzzle = generateImpossible();
    answers = [];
    // Double-check: must have 0 matches
    var check = findAnswers(puzzle);
    if(check.length > 0){
      // Try once more
      puzzle = generateImpossible();
      answers = [];
    }
  } else {
    var result = generateSolvable();
    puzzle = result.pat;
    answers = result.ans;
    // Double-check: must have at least 1 match
    if(answers.length === 0){
      result = generateSolvable();
      puzzle = result.pat;
      answers = result.ans;
    }
  }
  
  renderPuzzle();
}

function handleAnswer(userSaysYes){
  var hasWord = answers.length > 0;
  var correct = (userSaysYes === hasWord);
  
  if(hasWord){
    // Solvable puzzle - show the real word with link
    var chosen = answers[Math.floor(Math.random() * answers.length)];
    addAnswer(chosen.toUpperCase(), 'https://en.wiktionary.org/wiki/' + chosen.toLowerCase(), correct);
  } else {
    // Impossible puzzle - show the puzzle pattern itself (with underscores), no link
    addAnswer(puzzle, null, correct);
  }
  
  if(correct){
    if(tabLevel > 0){
      tabLevel--;
      if(tabLevel === 0) score = 0;
    } else {
      score++;
    }
    newPuzzle();
  } else {
    if(score < 0){
      tabLevel++;
    } else {
      score = -1;
      tabLevel = 1;
    }
    
    if(tabLevel >= MAX_TABS){
      locked = true;
      puzzleEl.classList.add('flashing');
      setTimeout(function(){
        puzzleEl.classList.remove('flashing');
        puzzleEl.textContent = '';
        dropLine();
      }, 1000);
    } else {
      newPuzzle();
    }
  }
  updateScoreDisplay();
}

function dropLine(){
  rowPad++;
  applyRowPad();
  
  var avail = availableLines();
  if(avail - rowPad < 2){
    gameoverEl.style.display = 'flex';
    locked = true;
    return;
  }
  
  tabLevel = 0;
  score = 0;
  locked = false;
  updateScoreDisplay();
  newPuzzle();
  renderAnswers();
}

// Keyboard input
document.addEventListener('keydown', function(e){
  var k = e.key.toUpperCase();
  if(k !== 'Y' && k !== 'N') return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if(locked) return;
  handleAnswer(k === 'Y');
}, true);

// Touch button input
document.getElementById('btnY').addEventListener('click', function(){
  if(!locked) handleAnswer(true);
});
document.getElementById('btnN').addEventListener('click', function(){
  if(!locked) handleAnswer(false);
});

window.addEventListener('resize', function(){
  renderAnswers();
});

// Curated fallback dictionary (real English words only)
var TWL_FALLBACK = [
  'horse','house','mouse','worse','curse','nurse','bird','bard','bord','burd',
  'cat','cot','cut','fox','fax','fix','wolf','crank','blade','grass','stone',
  'tone','bone','cone','done','gone','lone','none','zone','hone','phone','field',
  'yield','shield','wield','build','guild','child','mild','wild','think','drink',
  'spare','share','stare','flare','glare','snare','bare','care','dare','fare',
  'flesh','fresh','mesh','bash','cash','clash','crash','dash','flash','trash',
  'brain','train','grain','drain','plain','main','pain','rain','vain','chain',
  'drive','strive','thrive','alive','hive','dive','live','place','space','grace'
];

async function loadDict(){
  setStatus('loading Scrabble dictionary...');
  
  var urls = [
    'https://raw.githubusercontent.com/jesstess/Scrabble/master/TWL.txt',
    'https://raw.githubusercontent.com/redbo/scrabble/master/dictionary.txt'
  ];
  
  var loaded = false;
  for(var u = 0; u < urls.length && !loaded; u++){
    try{
      var r = await fetch(urls[u]);
      if(r.ok){
        var t = await r.text();
        var rawWords = t.split('\n').map(function(w){ return w.trim().toLowerCase(); });
        dict = rawWords.filter(function(w){ 
          return w.length >= 3 && w.length <= 7 && /^[a-z]+$/.test(w);
        });
        if(dict.length > 1000){
          loaded = true;
          setStatus('✓ ' + dict.length.toLocaleString() + 'real words');
        }
      }
    } catch(e){}
  }
  
  if(!loaded || dict.length < 500){
    dict = TWL_FALLBACK;
    setStatus('✓ ' + dict.length + ' words | 70/30');
  }
  
  updateScoreDisplay();
  newPuzzle();
}

loadDict();
</script>
</body>
</html>
