<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>irresolvable?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;color:#ccc;
  font-family:'Courier New',Courier,monospace;
  font-size:15px;line-height:1.4;
  overflow:hidden;
  user-select:none;
}
#wrap{display:flex;flex-direction:column;width:100%;height:100%}

#title{
  color:#fff;white-space:pre;
  padding:2px 6px;
  border-bottom:1px solid #333;
  flex-shrink:0;letter-spacing:1px;
}

#puzzlerow{
  flex-shrink:0;
  white-space:pre;
}
#puzzleline{
  font-size:16px;letter-spacing:3px;
  color:#fff;white-space:pre;
  padding:4px 6px 2px 6px;
  min-height:24px;
}

#gap{flex:1}

#answerrow{
  flex-shrink:0;
  white-space:pre;
}
#answerblock{
  flex-shrink:0;
  padding:0 6px 4px 6px;
  overflow:hidden;
}
.aline{
  color:#6f6;font-size:14px;
  white-space:pre;line-height:1.4;
}
.aline a{
  color:#6f6;
  text-decoration:none;
  border-bottom:1px solid #3a3;
}
.aline a:hover{
  color:#aff;
}

#status{
  flex-shrink:0;font-size:11px;color:#383838;
  padding:1px 6px;border-top:1px solid #111;background:#050505;
}

#gameover{
  display:none;position:fixed;inset:0;background:#000;
  align-items:center;justify-content:center;z-index:99;
}
#gotext{color:#fff;font-size:26px;letter-spacing:4px;animation:gb .5s step-end infinite}
@keyframes gb{50%{opacity:0}}
@keyframes flash{0%,100%{opacity:1}25%,75%{opacity:0}}
.flashing{animation:flash .9s steps(1) forwards}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">irresolvable? [Y/N]</div>
  <div id="puzzlerow"></div>
  <div id="puzzleline"></div>
  <div id="gap"></div>
  <div id="answerrow"></div>
  <div id="answerblock"></div>
  <div id="status">loading dictionary (170k words)...</div>
</div>
<div id="gameover"><div id="gotext">irresolvable?</div></div>

<script>
var dict = [];
var dictSet = new Set();
var puzzle = '', answers = [];

var score    = 0;
var tabLevel = 0;
var rowPad   = 0;
var locked   = false;

var MAX_TABS = 9;
var TAB_SP   = 4;
var answerHistory = [];

var titleEl    = document.getElementById('title');
var puzzleRowEl= document.getElementById('puzzlerow');
var puzzleEl   = document.getElementById('puzzleline');
var gapEl      = document.getElementById('gap');
var answerRowEl= document.getElementById('answerrow');
var answerEl   = document.getElementById('answerblock');
var statusEl   = document.getElementById('status');
var gameoverEl = document.getElementById('gameover');

function renderPuzzle(){
  var prefix = ' '.repeat(tabLevel * TAB_SP);
  var sc = (tabLevel === 0 && score > 0) ? ' +' + score : '';
  puzzleEl.textContent = prefix + puzzle + sc;
}

function applyRowPad(){
  var pad = rowPad > 0 ? '\n'.repeat(rowPad) : '';
  puzzleRowEl.textContent = pad;
  answerRowEl.textContent = pad;
}

function addAnswer(text, link){
  answerHistory.unshift({text: text, link: link || null});
  renderAnswers();
}

function renderAnswers(){
  answerEl.innerHTML = '';
  var gapH  = gapEl.clientHeight;
  var lineH = (puzzleEl.clientHeight || 22) * 1.2;
  var max   = Math.max(1, Math.floor(gapH / lineH));
  var show  = answerHistory.slice(0, max);
  for(var i = 0; i < show.length; i++){
    var entry = show[i];
    var d = document.createElement('div');
    d.className = 'aline';
    if(entry.link){
      var a = document.createElement('a');
      a.href = entry.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = entry.text;
      d.appendChild(a);
    } else {
      d.textContent = entry.text;
    }
    answerEl.appendChild(d);
  }
}

function setStatus(t){ statusEl.textContent = t; }

function availableLines(){
  var wrapH  = document.getElementById('wrap').clientHeight;
  var titleH = titleEl.clientHeight;
  var statH  = document.getElementById('status').clientHeight;
  var lineH  = puzzleEl.clientHeight || 22;
  return Math.floor((wrapH - titleH - statH) / lineH);
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var x=arr[i];arr[i]=arr[j];arr[j]=x;
  }
  return arr;
}

function findAnswers(pattern){
  try{
    var re = new RegExp('^' + pattern.toLowerCase().replace(/_/g,'[a-z]') + '$');
    var matches = [];
    for(var i = 0; i < dict.length && matches.length < 20; i++){
      if(re.test(dict[i])) matches.push(dict[i]);
    }
    return matches;
  } catch(e){ return []; }
}

// Generate plausible non-words that LOOK like English
// These are constructed from real English morphemes but don't form actual words
var NONWORD_STARTS = ['NOT', 'WH', 'TH', 'SH', 'CH', 'PH', 'GH', 'QU', 'SP', 'ST', 'SL', 'SN', 'SW', 'GR', 'BR', 'CR', 'DR', 'FR', 'PR', 'TR', 'BL', 'CL', 'FL', 'GL', 'PL'];
var NONWORD_MIDDLES = ['O', 'A', 'E', 'I', 'U', 'OO', 'EE', 'OU', 'IO', 'EA', 'IA', 'OE'];
var NONWORD_ENDS = ['RD', 'ND', 'NT', 'NK', 'MP', 'LD', 'LT', 'RK', 'LK', 'RP', 'RT', 'RN', 'RM', 'RF', 'RV', 'RZ', 'LZ', 'NZ', 'X', 'Z', 'K', 'T', 'P', 'S'];

function generateNonWord(){
  var length = 5 + Math.floor(Math.random() * 3); // 5-7 letters
  var result = [];
  
  // Pick a plausible start
  var start = NONWORD_STARTS[Math.floor(Math.random() * NONWORD_STARTS.length)];
  result.push(start);
  
  // Add middle
  var middle = NONWORD_MIDDLES[Math.floor(Math.random() * NONWORD_MIDDLES.length)];
  result.push(middle);
  
  // Add end
  var end = NONWORD_ENDS[Math.floor(Math.random() * NONWORD_ENDS.length)];
  result.push(end);
  
  var nonword = result.join('').toLowerCase();
  
  // Ensure it's NOT in dictionary
  if(dictSet.has(nonword)){
    // Modify slightly
    var chars = nonword.split('');
    var idx = Math.floor(Math.random() * chars.length);
    chars[idx] = chars[idx] === 'a' ? 'o' : (chars[idx] === 'e' ? 'i' : 'a');
    nonword = chars.join('');
  }
  
  return nonword.toUpperCase();
}

function generateImpossible(){
  for(var attempt = 0; attempt < 100; attempt++){
    // Start with a non-word
    var nonword = generateNonWord();
    var chars = nonword.split('');
    
    // Blank out 1-3 positions
    var blankCount = 1 + Math.floor(Math.random() * Math.min(3, chars.length - 1));
    var positions = [];
    for(var i = 0; i < chars.length; i++) positions.push(i);
    positions = shuffle(positions).slice(0, blankCount);
    
    for(var i = 0; i < positions.length; i++){
      chars[positions[i]] = '_';
    }
    var pattern = chars.join('');
    
    // Verify no dictionary word matches
    var matches = findAnswers(pattern);
    if(matches.length === 0){
      return pattern;
    }
  }
  
  // Fallback guaranteed impossible patterns
  var fallbacks = ['_OT_ORD', '_H_NT_N', 'WH_T_R', 'TH_R_FT', 'N_WH_R'];
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

function generateSolvable(){
  for(var attempt = 0; attempt < 200; attempt++){
    var word = dict[Math.floor(Math.random() * dict.length)];
    if(word.length < 4 || word.length > 7) continue;
    
    var chars = word.split('');
    var blankCount = Math.floor(Math.random() * (word.length - 2)) + 1;
    var positions = [];
    for(var i = 0; i < chars.length; i++) positions.push(i);
    positions = shuffle(positions).slice(0, blankCount);
    
    for(var i = 0; i < positions.length; i++){
      chars[positions[i]] = '_';
    }
    var pattern = chars.join('').toUpperCase();
    var matches = findAnswers(pattern);
    
    if(matches.length >= 1 && matches.length <= 4){
      return {pat: pattern, ans: matches};
    }
  }
  
  return {pat: 'H_RSE', ans: ['horse','house','mouse','worse','parse']};
}

function newPuzzle(){
  if(dict.length === 0){
    setTimeout(newPuzzle, 100);
    return;
  }
  
  // 50/50 split
  if(Math.random() < 0.5){
    puzzle = generateImpossible();
    answers = [];
  } else {
    var result = generateSolvable();
    puzzle = result.pat;
    answers = result.ans;
  }
  renderPuzzle();
}

function handleAnswer(userSaysYes){
  var hasWord = answers.length > 0;
  var correct = (userSaysYes === hasWord);
  
  if(hasWord){
    var chosen = answers[Math.floor(Math.random() * answers.length)];
    addAnswer(chosen.toUpperCase(), 'https://en.wiktionary.org/wiki/' + chosen.toLowerCase());
  } else {
    addAnswer('-', null);
  }
  
  if(correct){
    if(tabLevel > 0){
      tabLevel--;
    } else {
      score++;
    }
    newPuzzle();
  } else {
    if(score > 0){
      score--;
      newPuzzle();
    } else {
      score = 0;
      tabLevel++;
      if(tabLevel >= MAX_TABS){
        locked = true;
        puzzleEl.classList.add('flashing');
        setTimeout(function(){
          puzzleEl.classList.remove('flashing');
          puzzleEl.textContent = '';
          dropLine();
        }, 1000);
      } else {
        newPuzzle();
      }
    }
  }
}

function dropLine(){
  rowPad++;
  applyRowPad();
  
  var avail = availableLines();
  if(avail - rowPad < 2){
    gameoverEl.style.display = 'flex';
    locked = true;
    return;
  }
  
  tabLevel = 0;
  score = 0;
  locked = false;
  newPuzzle();
  renderAnswers();
}

document.addEventListener('keydown', function(e){
  var k = e.key.toUpperCase();
  if(k !== 'Y' && k !== 'N') return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if(locked) return;
  handleAnswer(k === 'Y');
}, true);

window.addEventListener('resize', function(){
  renderAnswers();
});

var FALLBACK = ['horse','house','mouse','worse','bird','bard','cat','cot','cut'];

async function loadDict(){
  setStatus('fetching 170k English words...');
  try{
    var r = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
    var t = await r.text();
    var words = t.split('\n').map(function(w){ return w.trim().toLowerCase(); });
    dict = words.filter(function(w){ 
      return w.length >= 3 && w.length <= 8 && /^[a-z]+$/.test(w);
    });
    dictSet = new Set(dict);
    setStatus('✓ ' + dict.length.toLocaleString() + ' English words | 50/50 | Y/N');
  } catch(e){
    dict = FALLBACK;
    dictSet = new Set(dict);
    setStatus('offline - ' + dict.length + ' words');
  }
  newPuzzle();
}

loadDict();
</script>
</body>
</html>
