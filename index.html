<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>irresolvable?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;color:#ccc;
  font-family:'Courier New',Courier,monospace;
  font-size:15px;line-height:1.4;
  overflow:hidden;
  user-select:none;
}
#wrap{display:flex;flex-direction:column;width:100%;height:100%}

#title{
  color:#fff;white-space:pre;
  padding:2px 6px;
  border-bottom:1px solid #333;
  flex-shrink:0;letter-spacing:1px;
}

/* puzzle row — offset by rowPad blank lines below title */
#puzzlerow{
  flex-shrink:0;
  white-space:pre;
}
#puzzleline{
  font-size:16px;letter-spacing:3px;
  color:#fff;white-space:pre;
  padding:4px 6px 2px 6px;
  min-height:24px;
}

#gap{flex:1}

/* answer list — offset by same rowPad */
#answerrow{
  flex-shrink:0;
  white-space:pre;
}
#answerblock{
  flex-shrink:0;
  padding:0 6px 4px 6px;
  overflow:hidden;
}
.aline{
  color:#6f6;font-size:14px;
  white-space:pre;line-height:1.4;
}

#status{
  flex-shrink:0;font-size:11px;color:#383838;
  padding:1px 6px;border-top:1px solid #111;background:#050505;
}

#gameover{
  display:none;position:fixed;inset:0;background:#000;
  align-items:center;justify-content:center;z-index:99;
}
#gotext{color:#fff;font-size:26px;letter-spacing:4px;animation:gb .5s step-end infinite}
@keyframes gb{50%{opacity:0}}
@keyframes flash{0%,100%{opacity:1}25%,75%{opacity:0}}
.flashing{animation:flash .9s steps(1) forwards}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">irresolvable? [Y/N]</div>
  <div id="puzzlerow"></div>
  <div id="puzzleline"></div>
  <div id="gap"></div>
  <div id="answerrow"></div>
  <div id="answerblock"></div>
  <div id="status">loading...</div>
</div>
<div id="gameover"><div id="gotext">irresolvable?</div></div>

<script>
var dict = [], dictSet = new Set();
var puzzle = '', answers = [];

// Scoring model:
//   score > 0  : positive buffer, shown as "+N", tab=0
//   score = 0  : rest, no number shown, tab=0
//   score = -1 : shown as "-1" at tab=0 (one warning before displacement)
//   tab > 0    : displaced right, no number shown
//   tab < 0    : (not used, clamp at 0)

var score    = 0;   // integer, can be positive or -1 at tab=0
var tabLevel = 0;   // displacement steps right (0=left)
var rowPad   = 0;   // blank lines added below title (and above answer list)
var locked   = false;

var MAX_TABS = 9;
var TAB_SP   = 4;
var answerHistory = [];

var titleEl    = document.getElementById('title');
var puzzleRowEl= document.getElementById('puzzlerow');
var puzzleEl   = document.getElementById('puzzleline');
var gapEl      = document.getElementById('gap');
var answerRowEl= document.getElementById('answerrow');
var answerEl   = document.getElementById('answerblock');
var statusEl   = document.getElementById('status');
var gameoverEl = document.getElementById('gameover');

// ── render puzzle ─────────────────────────────────────────────
function renderPuzzle(){
  var prefix = ' '.repeat(tabLevel * TAB_SP);
  var sc = (tabLevel === 0 && score > 0) ? ' +' + score : '';
  puzzleEl.textContent = prefix + puzzle + sc;
}

// ── row padding (blank lines above puzzle and above answer list) ──
function applyRowPad(){
  // blank lines = rowPad newlines rendered as empty divs via white-space:pre
  var pad = rowPad > 0 ? '\n'.repeat(rowPad) : '';
  puzzleRowEl.textContent = pad;
  answerRowEl.textContent = pad;
}

// ── answer list ───────────────────────────────────────────────
function addAnswer(text, link){
  answerHistory.unshift({text: text, link: link || null});
  renderAnswers();
}

function renderAnswers(){
  answerEl.innerHTML = '';
  var gapH  = gapEl.clientHeight;
  var lineH = puzzleEl.clientHeight || 22;
  var max   = Math.max(1, Math.floor(gapH / lineH));
  var show  = answerHistory.slice(0, max);
  for(var i = 0; i < show.length; i++){
    var entry = show[i];
    var d = document.createElement('div');
    d.className = 'aline';
    if(entry.link){
      var a = document.createElement('a');
      a.href = entry.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = entry.text;
      a.style.cssText = 'color:#6f6;text-decoration:none;border-bottom:1px solid #3a3;';
      a.onmouseover = function(){ this.style.color='#aff'; };
      a.onmouseout  = function(){ this.style.color='#6f6'; };
      d.appendChild(a);
    } else {
      d.textContent = entry.text;
    }
    answerEl.appendChild(d);
  }
}

function setStatus(t){ statusEl.textContent = t; }

// ── available lines below title ───────────────────────────────
function availableLines(){
  var wrapH  = document.getElementById('wrap').clientHeight;
  var titleH = titleEl.clientHeight;
  var statH  = document.getElementById('status').clientHeight;
  var lineH  = puzzleEl.clientHeight || 22;
  return Math.floor((wrapH - titleH - statH) / lineH);
}

// ── dict ──────────────────────────────────────────────────────
async function loadDict(){
  setStatus('fetching dictionary...');
  try{
    var r = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
    var t = await r.text();
    dict = t.split('\n')
      .map(function(w){ return w.trim().toLowerCase(); })
      .filter(function(w){ return w.length>=3 && w.length<=8 && /^[a-z]+$/.test(w); });
    dictSet = new Set(dict);
    setStatus('Y = a word fits   N = no word fits   [' + dict.length.toLocaleString() + ' words]');
  } catch(e){
    dict = FALLBACK; dictSet = new Set(dict);
    setStatus('Y = a word fits   N = no word fits   [offline]');
  }
  newPuzzle();
}

// ── puzzle generation ─────────────────────────────────────────
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var x=a[i];a[i]=a[j];a[j]=x;
  }
  return a;
}

function findAnswers(pat){
  var re = new RegExp('^' + pat.toLowerCase().replace(/_/g,'[a-z]') + '$');
  return dict.filter(function(w){ return re.test(w); });
}

var BAD = ['zx','qk','vk','bx','fv','jx','kz','xz','vj',
           'bq','cj','fj','gx','hx','jz','kj','lx','mx',
           'nj','px','qv','rj','tj','vx','wx','yj','zj',
           'zw','zv','qx','qj','qz','xv','xw','xj','xk'];

function makeImpossible(){
  for(var att = 0; att < 800; att++){

    // 1. get a "rich" solvable pattern
    var base = makeSolvable();
    if(!base || base.ans.length < 4) continue;

    var pat = base.pat.split('');
    var n = pat.length;

    // 2. pick a position to corrupt
    var i = Math.floor(Math.random()*n);

    // 3. try replacing with plausible letters
    var letters = 'etaoinshrdlcumwfgypbvkjxqz';

    for(var j=0;j<letters.length;j++){
      var test = pat.slice();

      // replace underscore OR fixed letter
      test[i] = letters[j].toUpperCase();

      var str = test.join('');

      // skip if unchanged
      if(str === base.pat) continue;

      var ans = findAnswers(str);

      if(ans.length === 0){

        // avoid obvious junk patterns
        if(!/[qxz]{2}/i.test(str)){
          return str;
        }
      }
    }
  }

  return makeImpossibleFallback();
}

function makeImpossibleFallback(){
  // fallback: still try to look word-like
  var seeds = ['_IGHT','_AME','_ORE','_INE','_EST'];
  var s = seeds[Math.floor(Math.random()*seeds.length)];
  return s.replace('_', 'Z'); // mild poison, still readable
}

function newPuzzle(){
  if(Math.random() < 0.4){
    puzzle  = makeImpossible();
    answers = [];
  } else {
    var result = makeSolvable();
    if(result){ puzzle = result.pat; answers = result.ans; }
    else       { puzzle = makeImpossible(); answers = []; }
  }
  renderPuzzle();
}

// ── input ─────────────────────────────────────────────────────
document.addEventListener('keydown', function(e){
  var k = e.key.toUpperCase();
  if(k !== 'Y' && k !== 'N') return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if(locked) return;
  handleAnswer(k === 'Y');
}, true);

// ── game logic ────────────────────────────────────────────────
function handleAnswer(userSaysYes){
  var hasWord = answers.length > 0;
  var correct = (userSaysYes === hasWord);

  // always reveal word if one exists, regardless of Y or N
  if(hasWord){
    var chosen = answers[Math.floor(Math.random()*answers.length)];
    addAnswer(chosen.toUpperCase(), 'https://en.wiktionary.org/wiki/' + chosen.toLowerCase());
  } else {
    addAnswer('-', null);
  }

  if(correct){
    if(tabLevel > 0){
      tabLevel--;
    } else {
      score++;
    }
    newPuzzle();

  } else {
    if(score > 0){
      // burn positive buffer before shifting
      score--;
      newPuzzle();
    } else {
      // score is 0 (or already displaced): shift right
      score = 0;
      tabLevel++;
      if(tabLevel >= MAX_TABS){
        locked = true;
        puzzleEl.classList.add('flashing');
        setTimeout(function(){
          puzzleEl.classList.remove('flashing');
          puzzleEl.textContent = '';
          dropLine();
        }, 1000);
      } else {
        newPuzzle();
      }
    }
  }
}

// ── drop a line ───────────────────────────────────────────────
function dropLine(){
  rowPad++;
  applyRowPad();

  var avail = availableLines();
  if(avail - rowPad < 2){
    gameoverEl.style.display = 'flex';
    locked = true;
    return;
  }

  tabLevel = 0;
  score    = 0;
  locked   = false;
  newPuzzle();
  renderAnswers();
}

window.addEventListener('resize', function(){
  renderAnswers();
});

'green','greet','creek','creep','breed','freed','treed','steed','creed',

'black','slack','crack','track','stack','snack','knack','hack','jack','rack',

'spare','share','stare','flare','glare','snare','bare','care','dare','fare',

loadDict();
</script>
