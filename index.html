<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>irresolvable?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;color:#ccc;
  font-family:'Courier New',Courier,monospace;
  font-size:14px;
  line-height:1.3;
  overflow:hidden;
  user-select:none;
}
#wrap{
  display:flex;
  flex-direction:column;
  width:100%;
  height:100%;
}

#title{
  color:#fff;
  white-space:nowrap;
  padding:2px 6px;
  border-bottom:1px solid #333;
  flex-shrink:0;
  font-size:14px;
  letter-spacing:0;
}

#instruction{
  color:#6f6;
  font-size:10px;
  padding:2px 6px;
  border-bottom:1px solid #333;
  flex-shrink:0;
  white-space:nowrap;
}

#puzzlerow{
  flex-shrink:0;
  white-space:pre;
}

#puzzleline{
  font-size:14px;
  letter-spacing:1px;
  color:#fff;
  white-space:pre;
  padding:4px 6px 2px 6px;
  min-height:24px;
  transition:color 0.1s ease;
  font-family:'Courier New',Courier,monospace;
  word-break:break-all;
  white-space:normal;
}

#puzzleline.warning{
  color:#f66;
}

#gap{
  flex:1;
  min-height:20px;
}

#answerrow{
  flex-shrink:0;
  white-space:pre;
}

#answerblock{
  flex-shrink:0;
  padding:0 6px 4px 6px;
  overflow-y:auto;
  max-height:45vh;
}

.aline{
  font-size:12px;
  white-space:nowrap;
  line-height:1.3;
  margin:2px 0;
}

.aline.correct{
  color:#6f6;
}

.aline.incorrect{
  color:#f66;
}

.aline a{
  text-decoration:none;
  border-bottom:1px solid;
}

.aline.correct a{
  color:#6f6;
  border-bottom-color:#3a3;
}

.aline.incorrect a{
  color:#f66;
  border-bottom-color:#a33;
}

.aline a:hover{
  color:#aff;
}

#status{
  flex-shrink:0;
  font-size:9px;
  color:#383838;
  padding:1px 6px;
  border-top:1px solid #111;
  background:#050505;
}

#gameover{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  align-items:center;
  justify-content:center;
  z-index:99;
}

#gotext{
  color:#fff;
  font-size:22px;
  letter-spacing:3px;
  animation:gb .5s step-end infinite;
}

@keyframes gb{
  50%{opacity:0}
}

@keyframes flash{
  0%,100%{opacity:1}
  25%,75%{opacity:0}
}

.flashing{
  animation:flash .9s steps(1) forwards;
}

/* Y/N buttons - smaller for mobile */
#buttons{
  position:fixed;
  top:2px;
  right:4px;
  display:flex;
  gap:6px;
  z-index:100;
}

#buttons button{
  background:#111;
  color:#ccc;
  border:1px solid #333;
  font-family:'Courier New',Courier,monospace;
  font-size:16px;
  font-weight:bold;
  width:40px;
  height:40px;
  border-radius:4px;
  cursor:pointer;
  transition:all 0.1s ease;
  touch-action:manipulation;
}

#buttons button:active{
  background:#333;
  color:#fff;
  transform:scale(0.96);
}

/* Mobile adjustments */
@media (max-width: 600px){
  #puzzleline{
    font-size:12px;
    letter-spacing:0;
    white-space:normal;
    word-break:break-word;
  }
  .aline{
    font-size:11px;
    white-space:normal;
    word-break:break-word;
  }
  #title{
    font-size:12px;
    padding-right:50px;
  }
  #buttons button{
    width:36px;
    height:36px;
    font-size:14px;
  }
}
</style>
</head>
<body>

<!-- Y/N Buttons for touch -->
<div id="buttons">
  <button id="btnY">Y</button>
  <button id="btnN">N</button>
</div>

<div id="wrap">
  <div id="title">irresolvable? [Y/N]</div>
  <div id="instruction">what's a word? what's not? enter Y / N</div>
  <div id="puzzlerow"></div>
  <div id="puzzleline"></div>
  <div id="gap"></div>
  <div id="answerrow"></div>
  <div id="answerblock"></div>
  <div id="status">loading Scrabble dictionary...</div>
</div>

<div id="gameover">
  <div id="gotext">irresolvable?</div>
</div>

<script>
var dict = [];
var puzzle = '', answers = [];

var score    = 0;
var tabLevel = 0;
var rowPad   = 0;
var locked   = false;

// Reduce max tabs for mobile (fits in screen)
var isMobile = window.innerWidth <= 600;
var MAX_TABS = isMobile ? 5 : 9;
var TAB_SP   = isMobile ? 2 : 4;

var answerHistory = [];

var titleEl    = document.getElementById('title');
var puzzleRowEl= document.getElementById('puzzlerow');
var puzzleEl   = document.getElementById('puzzleline');
var gapEl      = document.getElementById('gap');
var answerRowEl= document.getElementById('answerrow');
var answerEl   = document.getElementById('answerblock');
var statusEl   = document.getElementById('status');
var gameoverEl = document.getElementById('gameover');

function renderPuzzle(){
  var prefix = ' '.repeat(tabLevel * TAB_SP);
  var sc = (tabLevel === 0 && score > 0) ? ' +' + score : '';
  puzzleEl.textContent = prefix + puzzle + sc;
  
  if(tabLevel >= 1){
    puzzleEl.classList.add('warning');
  } else {
    puzzleEl.classList.remove('warning');
  }
}

function applyRowPad(){
  var pad = rowPad > 0 ? '\n'.repeat(rowPad) : '';
  puzzleRowEl.textContent = pad;
  answerRowEl.textContent = pad;
}

function addAnswer(text, link, wasCorrect){
  answerHistory.unshift({text: text, link: link || null, correct: wasCorrect});
  renderAnswers();
}

function renderAnswers(){
  answerEl.innerHTML = '';
  var gapH  = gapEl.clientHeight;
  var lineH = (puzzleEl.clientHeight || 22) * 1.2;
  var max   = Math.max(1, Math.floor(gapH / lineH));
  var show  = answerHistory.slice(0, max);
  for(var i = 0; i < show.length; i++){
    var entry = show[i];
    var d = document.createElement('div');
    d.className = 'aline ' + (entry.correct ? 'correct' : 'incorrect');
    if(entry.link){
      var a = document.createElement('a');
      a.href = entry.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = entry.text;
      d.appendChild(a);
    } else {
      d.textContent = entry.text;
    }
    answerEl.appendChild(d);
  }
}

function setStatus(t){ statusEl.textContent = t; }

function availableLines(){
  var wrapH  = document.getElementById('wrap').clientHeight;
  var titleH = titleEl.clientHeight;
  var statH  = document.getElementById('status').clientHeight;
  var lineH  = puzzleEl.clientHeight || 22;
  return Math.floor((wrapH - titleH - statH) / lineH);
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var x=arr[i];arr[i]=arr[j];arr[j]=x;
  }
  return arr;
}

function findAnswers(pattern){
  try{
    var re = new RegExp('^' + pattern.toLowerCase().replace(/_/g,'[a-z]') + '$');
    var matches = [];
    for(var i = 0; i < dict.length && matches.length < 12; i++){
      if(re.test(dict[i])) matches.push(dict[i]);
    }
    return matches;
  } catch(e){ return []; }
}

function generateImpossible(){
  if(dict.length === 0) return '_X_';
  
  for(var attempt = 0; attempt < 300; attempt++){
    var baseWord = dict[Math.floor(Math.random() * dict.length)];
    if(baseWord.length < 4 || baseWord.length > 7) continue;
    
    var chars = baseWord.split('');
    
    var vowelPositions = [];
    for(var i = 0; i < chars.length; i++){
      if('aeiou'.indexOf(chars[i]) !== -1) vowelPositions.push(i);
    }
    
    if(vowelPositions.length > 0){
      var pos = vowelPositions[Math.floor(Math.random() * vowelPositions.length)];
      var originalVowel = chars[pos];
      var otherVowels = ['a','e','i','o','u'].filter(function(v){ return v !== originalVowel; });
      var newVowel = otherVowels[Math.floor(Math.random() * otherVowels.length)];
      chars[pos] = newVowel;
    } else {
      if(chars.length >= 4){
        var idx1 = 1 + Math.floor(Math.random() * (chars.length - 2));
        var idx2 = 1 + Math.floor(Math.random() * (chars.length - 2));
        var temp = chars[idx1];
        chars[idx1] = chars[idx2];
        chars[idx2] = temp;
      }
    }
    
    var blankCount = 1 + Math.floor(Math.random() * Math.min(2, chars.length - 2));
    var positions = [];
    for(var i = 0; i < chars.length; i++) positions.push(i);
    positions = shuffle(positions).slice(0, blankCount);
    for(var i = 0; i < positions.length; i++){
      chars[positions[i]] = '_';
    }
    
    var pattern = chars.join('').toUpperCase();
    var matches = findAnswers(pattern);
    
    if(matches.length === 0){
      return pattern;
    }
  }
  
  var verifiedImpossible = [
    'WH_LK', 'TH_RP', 'CH_LK', 'BR_SS', 'CR_SS', 'DR_SS',
    'SP_GG', 'ST_GG', 'WH_RL', 'PR_NK', 'TR_NK', '_OT_ORD'
  ];
  
  for(var i = 0; i < verifiedImpossible.length; i++){
    if(findAnswers(verifiedImpossible[i]).length === 0){
      return verifiedImpossible[i];
    }
  }
  
  return '_OT_ORD';
}

function generateSolvable(){
  if(dict.length === 0) return {pat: 'H_RSE', ans: ['horse','house']};
  
  for(var attempt = 0; attempt < 300; attempt++){
    var word = dict[Math.floor(Math.random() * dict.length)];
    if(word.length < 4 || word.length > 7) continue;
    
    var blankCount = 1 + (Math.random() < 0.3 ? 2 : 1);
    blankCount = Math.min(blankCount, word.length - 2);
    
    var chars = word.split('');
    var positions = [];
    for(var i = 0; i < chars.length; i++) positions.push(i);
    positions = shuffle(positions).slice(0, blankCount);
    for(var i = 0; i < positions.length; i++){
      chars[positions[i]] = '_';
    }
    
    var pattern = chars.join('').toUpperCase();
    var matches = findAnswers(pattern);
    
    if(matches.length >= 1 && matches.length <= 4){
      return {pat: pattern, ans: matches};
    }
  }
  
  return {pat: 'H_RSE', ans: ['horse','house','mouse']};
}

function newPuzzle(){
  if(dict.length === 0){
    setTimeout(newPuzzle, 100);
    return;
  }
  
  var isImpossible = Math.random() < 0.3;
  
  if(isImpossible){
    puzzle = generateImpossible();
    answers = [];
    var check = findAnswers(puzzle);
    if(check.length > 0){
      puzzle = generateImpossible();
      answers = [];
    }
  } else {
    var result = generateSolvable();
    puzzle = result.pat;
    answers = result.ans;
  }
  
  renderPuzzle();
}

function handleAnswer(userSaysYes){
  var hasWord = answers.length > 0;
  var correct = (userSaysYes === hasWord);
  
  if(hasWord){
    var chosen = answers[Math.floor(Math.random() * answers.length)];
    addAnswer(chosen.toUpperCase(), 'https://en.wiktionary.org/wiki/' + chosen.toLowerCase(), correct);
  } else {
    addAnswer('-', null, correct);
  }
  
  if(correct){
    if(tabLevel > 0){
      tabLevel--;
    } else {
      score++;
    }
    newPuzzle();
  } else {
    score = 0;
    tabLevel++;
    
    if(tabLevel >= MAX_TABS){
      locked = true;
      puzzleEl.classList.add('flashing');
      setTimeout(function(){
        puzzleEl.classList.remove('flashing');
        puzzleEl.textContent = '';
        dropLine();
      }, 1000);
    } else {
      newPuzzle();
    }
  }
}

function dropLine(){
  rowPad++;
  applyRowPad();
  
  var avail = availableLines();
  if(avail - rowPad < 2){
    gameoverEl.style.display = 'flex';
    locked = true;
    return;
  }
  
  tabLevel = 0;
  score = 0;
  locked = false;
  newPuzzle();
  renderAnswers();
}

// Keyboard input
document.addEventListener('keydown', function(e){
  var k = e.key.toUpperCase();
  if(k !== 'Y' && k !== 'N') return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if(locked) return;
  handleAnswer(k === 'Y');
}, true);

// Touch button input
document.getElementById('btnY').addEventListener('click', function(){
  if(!locked) handleAnswer(true);
});
document.getElementById('btnN').addEventListener('click', function(){
  if(!locked) handleAnswer(false);
});

window.addEventListener('resize', function(){
  renderAnswers();
});

var TWL_FALLBACK = [
  'horse','house','mouse','worse','curse','nurse','bird','bard','bord','burd',
  'cat','cot','cut','fox','fax','fix','wolf','crank','blade','grass','stone',
  'tone','bone','cone','done','gone','lone','none','zone','hone','phone','field',
  'yield','shield','wield','build','guild','child','mild','wild','think','drink',
  'spare','share','stare','flare','glare','snare','bare','care','dare','fare',
  'flesh','fresh','mesh','bash','cash','clash','crash','dash','flash','trash',
  'brain','train','grain','drain','plain','main','pain','rain','vain','chain',
  'drive','strive','thrive','alive','hive','dive','live','place','space','grace'
];

async function loadDict(){
  setStatus('loading Scrabble dictionary...');
  
  var urls = [
    'https://raw.githubusercontent.com/jesstess/Scrabble/master/TWL.txt',
    'https://raw.githubusercontent.com/redbo/scrabble/master/dictionary.txt'
  ];
  
  var loaded = false;
  for(var u = 0; u < urls.length && !loaded; u++){
    try{
      var r = await fetch(urls[u]);
      if(r.ok){
        var t = await r.text();
        var rawWords = t.split('\n').map(function(w){ return w.trim().toLowerCase(); });
        dict = rawWords.filter(function(w){ 
          return w.length >= 3 && w.length <= 7 && /^[a-z]+$/.test(w);
        });
        if(dict.length > 1000){
          loaded = true;
          setStatus('✓ ' + dict.length.toLocaleString() + ' words | 70% real / 30% fake');
        }
      }
    } catch(e){}
  }
  
  if(!loaded || dict.length < 500){
    dict = TWL_FALLBACK;
    setStatus('✓ ' + dict.length + ' words | 70/30');
  }
  
  newPuzzle();
}

loadDict();
</script>
</body>
</html>
