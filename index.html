<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>_NY L_ST WO_DZ?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;
  color:#fff;
  font-family:'Courier New',Courier,monospace;
  font-size:14px;
  line-height:1.3;
  overflow:hidden;
  user-select:none;
}
#wrap{
  display:flex;
  flex-direction:column;
  width:100%;
  height:100%;
}

#title{
  background:#fff;
  color:#000;
  white-space:nowrap;
  padding:4px 6px;
  flex-shrink:0;
  font-size:18px;
  letter-spacing:0;
  font-weight:bold;
}

#instruction{
  color:#6f6;
  font-size:18px;
  padding:2px 6px;
  border-bottom:1px solid #fff;
  flex-shrink:0;
  white-space:nowrap;
}

#topspacer{
  height:20px;
  flex-shrink:0;
}

#titleSpacer{
  height:120px;
  flex-shrink:0;
}

#puzzleSpacer{
  height:60px;
  flex-shrink:0;
}
  
#puzzlerow{
  flex-shrink:0;
  white-space:pre;
  font-family:'Courier New',Courier,monospace;
}

#puzzleline{
  font-size:30px;
  letter-spacing:2px;
  color:#fff;
  white-space:pre;
  padding:4px 6px 2px 6px;
  min-height:24px;
  transition:color 0.1s ease;
  font-family:'Courier New',Courier,monospace;
}

#puzzleline.warning{
  color:#f66;
}

#gap{
  flex:0;
  min-height:5px;
}

#answerrow{
  flex-shrink:0;
  white-space:pre;
}

#answerblock{
  flex:0 0 auto;
  padding:0 6px 4px 6px;
  column-count:3;
  column-gap:20px;
  column-fill: auto;
  overflow-y:auto;
  max-height:35vh;
  min-height:100px;
  width:100%;
}

.aline{
  font-size:16px;
  white-space:nowrap;
  line-height:1.3;
  margin:2px 0;
  font-family:'Courier New',Courier,monospace;
  break-inside:avoid;
}

.aline.correct{
  color:#6f6;
}

.aline.incorrect{
  color:#f66;
}

.aline a{
  text-decoration:none;
  border-bottom:1px solid;
}

.aline.correct a{
  color:#6f6;
  border-bottom-color:#6f6;
}

.aline.incorrect a{
  color:#f66;
  border-bottom-color:#f66;
}

.aline a:hover{
  color:#fff;
}

#status{
  flex-shrink:0;
  font-size:11px;
  color:#fff;
  padding:1px 6px;
  border-top:1px solid #fff;
  background:#000;
}

#gameover{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  align-items:center;
  justify-content:center;
  z-index:99;
}

#gotext{
  color:#fff;
  font-size:22px;
  letter-spacing:3px;
  animation:gb .5s step-end infinite;
}

@keyframes gb{
  50%{opacity:0}
}

@keyframes flash{
  0%,100%{opacity:1}
  25%,75%{opacity:0}
}

.flashing{
  animation:flash .9s steps(1) forwards;
}

/* Top controls: Score left, Y/N buttons right */
#scorebox{
  position:fixed;
  top:2px;
  left:4px;
  background:#000;
  color:#fff;
  border:2px solid #fff;
  font-family:'Courier New',Courier,monospace;
  font-size:48px;
  font-weight:bold;
  width:80px;
  height:90px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  z-index:100;
}

#scorebox.positive{
  color:#6f6;
  border-color:#6f6;
}

#scorebox.negative{
  color:#f66;
  border-color:#f66;
}

#scorebox.zero{
  color:#fff;
  border-color:#fff;
}

#buttons{
  position:fixed;
  top:2px;
  right:4px;
  display:flex;
  gap:12px;
  z-index:100;
}

#buttons button{
  background:#000;
  font-family:'Courier New',Courier,monospace;
  font-size:48px;
  font-weight:bold;
  width:120px;
  height:90px;
  border-radius:8px;
  cursor:pointer;
  transition:all 0.1s ease;
  touch-action:manipulation;
}

#buttons button#btnY{
  color:#6f6;
  border:2px solid #6f6;
}

#buttons button#btnN{
  color:#f66;
  border:2px solid #f66;
}

#buttons button#btnY:active{
  background:#6f6;
  color:#000;
  transform:scale(0.96);
}

#buttons button#btnN:active{
  background:#f66;
  color:#000;
  transform:scale(0.96);
}

/* Message box - fixed at bottom */
#messagebox{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#000;
  border-top:2px solid #fff;
  padding:6px;
  font-size:15px;
  color:#fff;
  z-index:101;
}
#messagebox input{
  background:#000;
  border:1px solid #fff;
  color:#fff;
  font-family:'Courier New',Courier,monospace;
  font-size:16px;
  padding:4px 6px;
  width:70%;
  margin-right:4px;
}
#messagebox button{
  background:#000;
  border:1px solid #fff;
  color:#6f6; 
  font-family:'Courier New',Courier,monospace;
  font-size:16px;
  padding:4px 8px;
  cursor:pointer;
}
#messagebox button:active{
  background:#fff;
  color:#000;
}
#messageDisplay{
  margin-top:4px;
  padding-top:4px;
  border-top:1px dotted #fff;
  font-size:9px;
  word-break:break-word;
  max-height:50px;
  overflow-y:auto;
}
.message-entry{
  margin:2px 0;
  color:#fff;
}

@media (max-width: 600px){
  #topspacer{
    height:10px;
  }
  #title{
    font-size:25px;
    padding-right:100px;
  }
  #puzzleline{
    font-size:50px;
    letter-spacing:1px;
  }
  .aline{
    font-size:14px;
  }
  #scorebox{
    width:60px;
    height:70px;
    font-size:36px;
  }
  #buttons button{
    width:80px;
    height:70px;
    font-size:36px;
  }
  #messagebox input{
    width:65%;
  }
}
</style>
</head>
<body>

<!-- Score left -->
<div id="scorebox">0</div>

<!-- Y/N buttons right -->
<div id="buttons">
  <button id="btnY">Y</button>
  <button id="btnN">N</button>
</div>

<div id="wrap">
 <div id="titleSpacer"></div>
<div id="title"><span style="color:#000;">_NY<br>L_ST<br>WO_DZ? </span></div>
<div id="instruction">what's a WORD? what's NOT?</div>
<div id="instruction">is THIS one?! select Y or N!</div>
<div id="puzzleSpacer"></div>
<div id="puzzlerow"></div>
<div id="puzzleline"></div>
  <div id="gap"></div>
  <div id="answerrow"></div>
  <div id="answerblock"></div>

</div>
  
  <div id="status">loading Scrabble dictionary...</div>

  <div id="gameover">
  <div id="gotext">_NY L_ST W_RDZ?</div>
</div>

<!-- Message box at bottom - FIXED POSITION -->
<div id="messagebox">
  <span style="color:#fff;"></span> Compiled with Scrabble TWL dictionary. Click word for Wiktionary definition.<br>
  <span style="color:#fff;"></span> <a href="https://en.wiktionary.org/wiki/bozoid" target="_blank" style="color:#fff; text-decoration:underline;">BOZOIDS</a>? H_TERS? Fake words? False negatives? Notes welcome <span style="color:#fff;"></span> <a href="https://github.com/charcomarx" target="_blank" style="color:#fff; text-decoration:underline;">HERE @ GitHub</a><br>
  <input type="text" id="noteInput" maxlength="300" placeholder="What are you thinking?" style="font-size:16px;">
  <button id="submitNote">send</button>
  <div id="messageDisplay"></div>
</div>

<script>
var dict = [];
var puzzle = '', answers = [];

var score    = 0;
var tabLevel = 0;
var rowPad   = 0;
var locked   = false;

// Mobile detection for tabs
var isMobile = window.innerWidth <= 600;
var MAX_TABS = isMobile ? 3 : 3;
var TAB_SP   = isMobile ? 2 : 4;

var answerHistory = [];

var titleEl    = document.getElementById('title');
var puzzleRowEl= document.getElementById('puzzlerow');
var puzzleEl   = document.getElementById('puzzleline');
var gapEl      = document.getElementById('gap');
var answerRowEl= document.getElementById('answerrow');
var answerEl   = document.getElementById('answerblock');
var statusEl   = document.getElementById('status');
var gameoverEl = document.getElementById('gameover');
var scoreBox   = document.getElementById('scorebox');

function updateScoreDisplay(){
  if(score > 0){
    scoreBox.textContent = '' + score;
    scoreBox.className = 'positive';
  } else if(score < 0){
    scoreBox.textContent = '!';
    scoreBox.className = 'negative';
  } else {
    scoreBox.textContent = '0';
    scoreBox.className = 'zero';
  }
}

function renderPuzzle(){
  var prefix = '';
  for(var i = 0; i < tabLevel * TAB_SP; i++) prefix += ' ';
  puzzleEl.textContent = prefix + puzzle;
  
  if(tabLevel >= 1){
    puzzleEl.classList.add('warning');
  } else {
    puzzleEl.classList.remove('warning');
  }
}

function applyRowPad(){
  var pad = rowPad > 0 ? '\n'.repeat(rowPad) : '';
  puzzleRowEl.textContent = pad;
  answerRowEl.textContent = pad;
}

function addAnswer(text, link, wasCorrect){
  answerHistory.unshift({text: text, link: link || null, correct: wasCorrect});
  renderAnswers();
}

function renderAnswers(){
  answerEl.innerHTML = '';
  // Show ALL answers, no limit
  for(var i = 0; i < answerHistory.length; i++){
    var entry = answerHistory[i];
    var d = document.createElement('div');
    d.className = 'aline ' + (entry.correct ? 'correct' : 'incorrect');
    if(entry.link){
      var a = document.createElement('a');
      a.href = entry.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = entry.text;
      d.appendChild(a);
    } else {
      d.textContent = entry.text;
    }
    answerEl.appendChild(d);
  }
}

function setStatus(t){ statusEl.textContent = t; }

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var x=arr[i];arr[i]=arr[j];arr[j]=x;
  }
  return arr;
}

function findAnswers(pattern){
  try{
    var re = new RegExp('^' + pattern.toLowerCase().replace(/_/g,'[a-z]') + '$');
    var matches = [];
    for(var i = 0; i < dict.length && matches.length < 12; i++){
      if(re.test(dict[i])) matches.push(dict[i]);
    }
    return matches;
  } catch(e){ return []; }
}

// Generate IMPOSSIBLE puzzle - ONLY returns patterns with 0 dictionary matches
function generateImpossible(){
  for(var attempt = 0; attempt < 500; attempt++){
    var baseWord = dict[Math.floor(Math.random() * dict.length)];
    if(!baseWord || baseWord.length < 4 || baseWord.length > 7) continue;
    
    var chars = baseWord.split('');
    
    var pos = Math.floor(Math.random() * chars.length);
    var originalChar = chars[pos];
    var newChar;
    
    if('aeiou'.indexOf(originalChar) !== -1){
      var vowels = ['a','e','i','o','u'];
      var others = vowels.filter(function(v){ return v !== originalChar; });
      if(others.length === 0) continue;
      newChar = others[Math.floor(Math.random() * others.length)];
    } else {
      var consonants = 'bcdfghklmnpqrstvwxyz'.split('');
      var otherConsonants = consonants.filter(function(c){ return c !== originalChar; });
      if(otherConsonants.length === 0) continue;
      newChar = otherConsonants[Math.floor(Math.random() * otherConsonants.length)];
    }
    chars[pos] = newChar;
    
    var blankCount = 1 + Math.floor(Math.random() * Math.min(2, chars.length - 2));
    var positions = [];
    for(var i = 0; i < chars.length; i++) positions.push(i);
    positions = shuffle(positions).slice(0, blankCount);
    for(var i = 0; i < positions.length; i++){
      chars[positions[i]] = '_';
    }
    
    var pattern = chars.join('').toUpperCase();
    var matches = findAnswers(pattern);
    
    if(matches.length === 0){
      return pattern;
    }
  }
  
  return '_X_Z_Q_';
}

// Generate SOLVABLE puzzle - returns patterns with 1-4 dictionary matches
function generateSolvable(){
  for(var attempt = 0; attempt < 300; attempt++){
    var word = dict[Math.floor(Math.random() * dict.length)];
    if(!word || word.length < 4 || word.length > 7) continue;
    
    var blankCount = 1 + (Math.random() < 0.3 ? 2 : 1);
    blankCount = Math.min(blankCount, word.length - 2);
    
    var chars = word.split('');
    var positions = [];
    for(var i = 0; i < chars.length; i++) positions.push(i);
    positions = shuffle(positions).slice(0, blankCount);
    for(var i = 0; i < positions.length; i++){
      chars[positions[i]] = '_';
    }
    
    var pattern = chars.join('').toUpperCase();
    var matches = findAnswers(pattern);
    
    if(matches.length >= 1 && matches.length <= 4){
      return {pat: pattern, ans: matches};
    }
  }
  
  var fallbacks = [
    {pat: 'H_RSE', ans: ['horse','house','mouse']},
    {pat: 'B_RD', ans: ['bird','bard','bord']},
    {pat: 'C_T', ans: ['cat','cot','cut']},
    {pat: 'ST_NE', ans: ['stone','stane','stine']}
  ];
  return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

function newPuzzle(){
  if(dict.length === 0){
    setTimeout(newPuzzle, 100);
    return;
  }
  
  var isImpossible = Math.random() < 0.3;
  
  if(isImpossible){
    puzzle = generateImpossible();
    answers = [];
    var check = findAnswers(puzzle);
    if(check.length > 0){
      puzzle = generateImpossible();
      answers = [];
    }
  } else {
    var result = generateSolvable();
    puzzle = result.pat;
    answers = result.ans;
    if(answers.length === 0){
      result = generateSolvable();
      puzzle = result.pat;
      answers = result.ans;
    }
  }
  
  renderPuzzle();
}

function handleAnswer(userSaysYes){
  var hasWord = answers.length > 0;
  var correct = (userSaysYes === hasWord);
  
  if(hasWord){
    var chosen = answers[Math.floor(Math.random() * answers.length)];
    addAnswer(chosen.toUpperCase(), 'https://en.wiktionary.org/wiki/' + chosen.toLowerCase(), correct);
  } else {
    addAnswer(puzzle, null, correct);
  }
  
  if(correct){
    if(tabLevel > 0){
      tabLevel--;
      if(tabLevel === 0) score = 0;
    } else {
      score++;
    }
    newPuzzle();
  } else {
    if(score < 0){
      tabLevel++;
    } else {
      score = -1;
      tabLevel = 1;
    }
    
    if(tabLevel >= MAX_TABS){
      locked = true;
      puzzleEl.classList.add('flashing');
      setTimeout(function(){
        puzzleEl.classList.remove('flashing');
        puzzleEl.textContent = '';
        dropLine();
      }, 1000);
    } else {
      newPuzzle();
    }
  }
  updateScoreDisplay();
}

function dropLine(){
  rowPad++;
  applyRowPad();
  
  tabLevel = 0;
  score = 0;
  locked = false;
  updateScoreDisplay();
  newPuzzle();
  renderAnswers();
}

// Keyboard input - ignore if message box is focused
document.addEventListener('keydown', function(e){
  var k = e.key.toUpperCase();
  if(k !== 'Y' && k !== 'N') return;
  
  if(document.activeElement && document.activeElement.id === 'noteInput') return;
  
  e.preventDefault();
  e.stopImmediatePropagation();
  if(locked) return;
  handleAnswer(k === 'Y');
}, true);

// Touch button input
document.getElementById('btnY').addEventListener('click', function(){
  if(!locked) handleAnswer(true);
});
document.getElementById('btnN').addEventListener('click', function(){
  if(!locked) handleAnswer(false);
});

window.addEventListener('resize', function(){
  renderAnswers();
});

// Message box functionality
var messages = [];

function loadMessages(){
  try{
    var saved = localStorage.getItem('anywordz_notes');
    if(saved) messages = JSON.parse(saved);
  } catch(e){ messages = []; }
  renderMessages();
}

function saveMessages(){
  try{
    var toSave = messages.slice(-20);
    localStorage.setItem('anywordz_notes', JSON.stringify(toSave));
  } catch(e){}
}

function renderMessages(){
  var container = document.getElementById('messageDisplay');
  if(!container) return;
  container.innerHTML = '';
  var show = messages.slice(-8).reverse();
  for(var i = 0; i < show.length; i++){
    var div = document.createElement('div');
    div.className = 'message-entry';
    var date = new Date(show[i].timestamp);
    var timeStr = date.toLocaleTimeString().slice(0,5);
    div.textContent = timeStr + ' › ' + show[i].text;
    container.appendChild(div);
  }
}

function addMessage(text){
  if(!text.trim()) return;
  messages.push({
    text: text.trim().slice(0,300),
    timestamp: Date.now()
  });
  saveMessages();
  renderMessages();
}

// Message box event listeners
var submitBtn = document.getElementById('submitNote');
var noteInput = document.getElementById('noteInput');

if(noteInput){
  noteInput.addEventListener('keydown', function(e){
    e.stopPropagation();
  });
  noteInput.addEventListener('keypress', function(e){
    if(e.key === 'Enter'){
      submitBtn.click();
    }
  });
}
if(submitBtn){
  submitBtn.addEventListener('click', function(){
    if(noteInput && noteInput.value.trim()){
      addMessage(noteInput.value);
      noteInput.value = '';
    }
  });
}

var TWL_FALLBACK = [
  'horse','house','mouse','worse','curse','nurse','bird','bard','bord','burd',
  'cat','cot','cut','fox','fax','fix','wolf','crank','blade','grass','stone',
  'tone','bone','cone','done','gone','lone','none','zone','hone','phone','field',
  'yield','shield','wield','build','guild','child','mild','wild','think','drink',
  'spare','share','stare','flare','glare','snare','bare','care','dare','fare',
  'flesh','fresh','mesh','bash','cash','clash','crash','dash','flash','trash',
  'brain','train','grain','drain','plain','main','pain','rain','vain','chain',
  'drive','strive','thrive','alive','hive','dive','live','place','space','grace'
];

async function loadDict(){
  setStatus('loading Scrabble dictionary...');
  
  var urls = [
    'https://raw.githubusercontent.com/jesstess/Scrabble/master/TWL.txt',
    'https://raw.githubusercontent.com/redbo/scrabble/master/dictionary.txt'
  ];
  
  var loaded = false;
  for(var u = 0; u < urls.length && !loaded; u++){
    try{
      var r = await fetch(urls[u]);
      if(r.ok){
        var t = await r.text();
        var rawWords = t.split('\n').map(function(w){ return w.trim().toLowerCase(); });
        dict = rawWords.filter(function(w){ 
          return w.length >= 3 && w.length <= 7 && /^[a-z]+$/.test(w);
        });
        if(dict.length > 1000){
          loaded = true;
          setStatus('✓ ' + dict.length.toLocaleString() + ' real words. Click to discover.');
        }
      }
    } catch(e){}
  }
  
  if(!loaded || dict.length < 500){
    dict = TWL_FALLBACK;
    setStatus('✓ ' + dict.length + ' words | 70/30');
  }
  
  updateScoreDisplay();
  newPuzzle();
}

loadMessages();
loadDict();
</script>
</body>
</html>
