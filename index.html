<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>irresolvable?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;color:#ccc;
  font-family:'Courier New',Courier,monospace;
  font-size:15px;line-height:1.4;
  overflow:hidden;
  user-select:none;
}
#wrap{display:flex;flex-direction:column;width:100%;height:100%}

#title{
  color:#fff;white-space:pre;
  padding:2px 6px;
  border-bottom:1px solid #333;
  flex-shrink:0;letter-spacing:1px;
}

#puzzlerow{
  flex-shrink:0;
  white-space:pre;
}
#puzzleline{
  font-size:16px;letter-spacing:3px;
  color:#fff;white-space:pre;
  padding:4px 6px 2px 6px;
  min-height:24px;
}

#gap{flex:1}

#answerrow{
  flex-shrink:0;
  white-space:pre;
}
#answerblock{
  flex-shrink:0;
  padding:0 6px 4px 6px;
  overflow:hidden;
}
.aline{
  color:#6f6;font-size:14px;
  white-space:pre;line-height:1.4;
}
.aline a{
  color:#6f6;
  text-decoration:none;
  border-bottom:1px solid #3a3;
}
.aline a:hover{
  color:#aff;
}

#status{
  flex-shrink:0;font-size:11px;color:#383838;
  padding:1px 6px;border-top:1px solid #111;background:#050505;
}

#gameover{
  display:none;position:fixed;inset:0;background:#000;
  align-items:center;justify-content:center;z-index:99;
}
#gotext{color:#fff;font-size:26px;letter-spacing:4px;animation:gb .5s step-end infinite}
@keyframes gb{50%{opacity:0}}
@keyframes flash{0%,100%{opacity:1}25%,75%{opacity:0}}
.flashing{animation:flash .9s steps(1) forwards}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">irresolvable? [Y/N]</div>
  <div id="puzzlerow"></div>
  <div id="puzzleline"></div>
  <div id="gap"></div>
  <div id="answerrow"></div>
  <div id="answerblock"></div>
  <div id="status">loading dictionary...</div>
</div>
<div id="gameover"><div id="gotext">irresolvable?</div></div>

<script>
var dict = [];
var puzzle = '', answers = [];

var score    = 0;
var tabLevel = 0;
var rowPad   = 0;
var locked   = false;

var MAX_TABS = 9;
var TAB_SP   = 4;
var answerHistory = [];

var titleEl    = document.getElementById('title');
var puzzleRowEl= document.getElementById('puzzlerow');
var puzzleEl   = document.getElementById('puzzleline');
var gapEl      = document.getElementById('gap');
var answerRowEl= document.getElementById('answerrow');
var answerEl   = document.getElementById('answerblock');
var statusEl   = document.getElementById('status');
var gameoverEl = document.getElementById('gameover');

function renderPuzzle(){
  var prefix = ' '.repeat(tabLevel * TAB_SP);
  var sc = (tabLevel === 0 && score > 0) ? ' +' + score : '';
  puzzleEl.textContent = prefix + puzzle + sc;
}

function applyRowPad(){
  var pad = rowPad > 0 ? '\n'.repeat(rowPad) : '';
  puzzleRowEl.textContent = pad;
  answerRowEl.textContent = pad;
}

function addAnswer(text, link){
  answerHistory.unshift({text: text, link: link || null});
  renderAnswers();
}

function renderAnswers(){
  answerEl.innerHTML = '';
  var gapH  = gapEl.clientHeight;
  var lineH = (puzzleEl.clientHeight || 22) * 1.2;
  var max   = Math.max(1, Math.floor(gapH / lineH));
  var show  = answerHistory.slice(0, max);
  for(var i = 0; i < show.length; i++){
    var entry = show[i];
    var d = document.createElement('div');
    d.className = 'aline';
    if(entry.link){
      var a = document.createElement('a');
      a.href = entry.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = entry.text;
      d.appendChild(a);
    } else {
      d.textContent = entry.text;
    }
    answerEl.appendChild(d);
  }
}

function setStatus(t){ statusEl.textContent = t; }

function availableLines(){
  var wrapH  = document.getElementById('wrap').clientHeight;
  var titleH = titleEl.clientHeight;
  var statH  = document.getElementById('status').clientHeight;
  var lineH  = puzzleEl.clientHeight || 22;
  return Math.floor((wrapH - titleH - statH) / lineH);
}

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var x=arr[i];arr[i]=arr[j];arr[j]=x;
  }
  return arr;
}

function findAnswers(pattern){
  try{
    var re = new RegExp('^' + pattern.toLowerCase().replace(/_/g,'[a-z]') + '$');
    var matches = [];
    for(var i = 0; i < dict.length && matches.length < 15; i++){
      if(re.test(dict[i])) matches.push(dict[i]);
    }
    return matches;
  } catch(e){ return []; }
}

// Generate a random pattern with plausible English letter distribution
function randomPattern(length){
  var pattern = [];
  // Start with consonant (most English words start with consonant)
  var consonants = 'BCDFGHKLMNPRSTVWXYZ';
  var vowels = 'AEIOU';
  
  for(var i = 0; i < length; i++){
    // Roughly 70% consonant, 30% vowel (English-like)
    var isVowel = Math.random() < 0.3;
    if(isVowel){
      pattern.push(vowels[Math.floor(Math.random() * vowels.length)]);
    } else {
      pattern.push(consonants[Math.floor(Math.random() * consonants.length)]);
    }
  }
  
  // Randomly replace 1-3 positions with blanks
  var blankCount = 1 + Math.floor(Math.random() * Math.min(3, length - 2));
  var positions = [];
  for(var i = 0; i < length; i++) positions.push(i);
  positions = shuffle(positions).slice(0, blankCount);
  for(var i = 0; i < positions.length; i++){
    pattern[positions[i]] = '_';
  }
  
  return pattern.join('');
}

// Generate a puzzle with EXACTLY targetAnswerCount (0 for impossible)
function generatePuzzleWithAnswerCount(targetCount){
  // Try up to 500 patterns
  for(var attempt = 0; attempt < 500; attempt++){
    var length = 4 + Math.floor(Math.random() * 4); // 4-7 letters
    var pattern = randomPattern(length);
    var matches = findAnswers(pattern);
    
    if(targetCount === 0 && matches.length === 0){
      // Found a true impossible
      return {pat: pattern, ans: []};
    }
    if(targetCount > 0 && matches.length >= 1 && matches.length <= 5){
      // Found a good solvable (1-5 answers)
      return {pat: pattern, ans: matches};
    }
  }
  
  // Fallback if generation fails
  if(targetCount === 0){
    // Guaranteed impossible fallbacks (verified against common dictionaries)
    var fallbackImpossible = ['ZX_K', 'QV_', 'JX_Z', 'K_QX', 'W_VZ', '_OT_ORD', 'WH_T_R'];
    for(var i = 0; i < fallbackImpossible.length; i++){
      if(findAnswers(fallbackImpossible[i]).length === 0){
        return {pat: fallbackImpossible[i], ans: []};
      }
    }
    return {pat: 'Z_XK_Q', ans: []};
  } else {
    // Guaranteed solvable fallbacks
    var fallbackSolvable = [
      {pat: 'H_RSE', ans: ['horse','house','mouse','worse']},
      {pat: 'B_RD', ans: ['bird','bard','bord']},
      {pat: 'C_T', ans: ['cat','cot','cut']},
      {pat: 'F_X', ans: ['fox','fax','fix']}
    ];
    var fb = fallbackSolvable[Math.floor(Math.random() * fallbackSolvable.length)];
    return {pat: fb.pat, ans: fb.ans};
  }
}

function newPuzzle(){
  if(dict.length === 0){
    setTimeout(newPuzzle, 100);
    return;
  }
  
  // EXACTLY 50/50 split - verified against loaded dictionary
  var isImpossible = Math.random() < 0.5;
  
  if(isImpossible){
    var result = generatePuzzleWithAnswerCount(0);
    puzzle = result.pat;
    answers = result.ans;
    
    // Double-check: this must have 0 answers
    var verify = findAnswers(puzzle);
    if(verify.length > 0){
      // Failed - try once more
      result = generatePuzzleWithAnswerCount(0);
      puzzle = result.pat;
      answers = result.ans;
    }
  } else {
    var result = generatePuzzleWithAnswerCount(1);
    puzzle = result.pat;
    answers = result.ans;
    
    // Must have at least 1 answer
    if(answers.length === 0){
      result = generatePuzzleWithAnswerCount(1);
      puzzle = result.pat;
      answers = result.ans;
    }
  }
  
  renderPuzzle();
}

function handleAnswer(userSaysYes){
  var hasWord = answers.length > 0;
  var correct = (userSaysYes === hasWord);
  
  if(hasWord){
    var chosen = answers[Math.floor(Math.random() * answers.length)];
    addAnswer(chosen.toUpperCase(), 'https://en.wiktionary.org/wiki/' + chosen.toLowerCase());
  } else {
    addAnswer('-', null);
  }
  
  if(correct){
    if(tabLevel > 0){
      tabLevel--;
    } else {
      score++;
    }
    newPuzzle();
  } else {
    if(score > 0){
      score--;
      newPuzzle();
    } else {
      score = 0;
      tabLevel++;
      if(tabLevel >= MAX_TABS){
        locked = true;
        puzzleEl.classList.add('flashing');
        setTimeout(function(){
          puzzleEl.classList.remove('flashing');
          puzzleEl.textContent = '';
          dropLine();
        }, 1000);
      } else {
        newPuzzle();
      }
    }
  }
}

function dropLine(){
  rowPad++;
  applyRowPad();
  
  var avail = availableLines();
  if(avail - rowPad < 2){
    gameoverEl.style.display = 'flex';
    locked = true;
    return;
  }
  
  tabLevel = 0;
  score = 0;
  locked = false;
  newPuzzle();
  renderAnswers();
}

document.addEventListener('keydown', function(e){
  var k = e.key.toUpperCase();
  if(k !== 'Y' && k !== 'N') return;
  e.preventDefault();
  e.stopImmediatePropagation();
  if(locked) return;
  handleAnswer(k === 'Y');
}, true);

window.addEventListener('resize', function(){
  renderAnswers();
});

var FALLBACK = ['horse','house','mouse','worse','bird','bard','cat','cot','cut','fox','fax','fix','wolf','crank','blade','grass','crane','plane','train','brain','chain','stone','phone','green','black','white','brown','small','large','quick','slow','high','low','soft','hard','light','dark','cold','hot','new','old','good','bad','long','short','wide','narrow'];

async function loadDict(){
  setStatus('fetching English dictionary (170k words)...');
  try{
    var r = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
    var t = await r.text();
    dict = t.split('\n')
      .map(function(w){ return w.trim().toLowerCase(); })
      .filter(function(w){ return w.length >= 3 && w.length <= 8 && /^[a-z]+$/.test(w); });
    setStatus('✓ ' + dict.length.toLocaleString() + ' words | 50/50 impossible/solvable | Y/N');
  } catch(e){
    dict = FALLBACK;
    setStatus('offline: ' + dict.length + ' common words | Y/N');
  }
  newPuzzle();
}

loadDict();
</script>
</body>
</html>
