<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>irresolvable?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;
  background:#000;color:#ccc;
  font-family:'Courier New',Courier,monospace;
  font-size:15px;line-height:1.4;
  overflow:hidden;
}
#wrap{display:flex;flex-direction:column;width:100%;height:100%}

#title{
  color:#fff;white-space:pre;
  padding:2px 6px;
  border-bottom:1px solid #333;
  flex-shrink:0;letter-spacing:1px;
}

#puzzleline{
  flex-shrink:0;
  font-size:17px;letter-spacing:3px;
  color:#fff;white-space:pre;
  padding:5px 6px 4px 6px;
  border-bottom:1px solid #222;
  min-height:28px;
}

#log{
  flex:1;overflow:hidden;
  display:flex;flex-direction:column;
  justify-content:flex-end;
  padding:4px 6px;
}
#loglines{display:flex;flex-direction:column;overflow:hidden}
.line{white-space:pre;line-height:1.4;flex-shrink:0;color:#555}
.green{color:#6f6}
.red{color:#f66}

#answerblock{
  flex-shrink:0;border-top:1px solid #333;
  padding:3px 6px;max-height:68px;
  overflow:hidden;display:flex;flex-direction:column-reverse;
}
#answerlines{display:flex;flex-direction:column-reverse}
.aline{color:#6f6;font-size:13px;white-space:pre;line-height:1.3}

#status{
  flex-shrink:0;font-size:11px;color:#444;
  padding:1px 6px;border-top:1px solid #111;background:#050505;
}

#gameover{
  display:none;position:fixed;inset:0;background:#000;
  align-items:center;justify-content:center;z-index:99;
}
#gotext{color:#fff;font-size:26px;letter-spacing:4px;animation:gb .5s step-end infinite}
@keyframes gb{50%{opacity:0}}
@keyframes flash{0%,100%{opacity:1}33%,66%{opacity:0}}
.flashing{animation:flash .8s steps(1) forwards}
</style>
</head>
<body>
<div id="wrap">
  <div id="title">irresolvable? [Y/N]</div>
  <div id="puzzleline"></div>
  <div id="log"><div id="loglines"></div></div>
  <div id="answerblock"><div id="answerlines"></div></div>
  <div id="status">loading dictionary...</div>
</div>
<div id="gameover"><div id="gotext">irresolvable?</div></div>

<script>
var dict=[], dictSet=new Set();
var puzzle='', answers=[];
var score=0, tabLevel=0, titleLines=0, locked=false;
var MAX_TABS=9, TAB_SP=4;

var titleEl    = document.getElementById('title');
var loglines   = document.getElementById('loglines');
var answerlines= document.getElementById('answerlines');
var puzzleEl   = document.getElementById('puzzleline');
var statusEl   = document.getElementById('status');
var gameoverEl = document.getElementById('gameover');

// ── Log ──────────────────────────────────────────────────────
function log(text, cls){
  var d=document.createElement('div');
  d.className='line'+(cls?' '+cls:'');
  d.textContent=text;
  loglines.appendChild(d);
  trimLog();
}
function trimLog(){
  var logEl=document.getElementById('log');
  var lineH=Math.round(15*1.4);
  var max=Math.floor(logEl.clientHeight/lineH);
  while(loglines.children.length>max) loglines.removeChild(loglines.firstChild);
}
function addAnswer(word){
  var d=document.createElement('div');
  d.className='aline';
  d.textContent=word;
  answerlines.prepend(d);
  while(answerlines.children.length>5) answerlines.removeChild(answerlines.lastChild);
}
function setStatus(t){statusEl.textContent=t}

// ── Dictionary ───────────────────────────────────────────────
async function loadDict(){
  setStatus('fetching dictionary...');
  try{
    var r=await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
    var t=await r.text();
    dict=t.split('\n').map(function(w){return w.trim().toLowerCase()})
      .filter(function(w){return w.length>=3&&w.length<=8&&/^[a-z]+$/.test(w)});
    dictSet=new Set(dict);
    setStatus('dictionary: '+dict.length.toLocaleString()+' words — Y if a word fits, N if none can');
  }catch(e){
    dict=FALLBACK; dictSet=new Set(dict);
    setStatus('offline dictionary ('+dict.length+' words) — Y if a word fits, N if none can');
  }
  newPuzzle();
}

// ── Puzzle generation ────────────────────────────────────────
// ~40% of puzzles are intentionally irresolvable
function makePuzzle(){
  if(Math.random()<0.4){
    return makeImpossible();
  } else {
    return makeSolvable();
  }
}

function makeSolvable(){
  for(var att=0;att<300;att++){
    var w=dict[Math.floor(Math.random()*dict.length)];
    var n=w.length;
    // blank 1 to floor(n*0.6) letters, minimum 1
    var maxB=Math.max(1,Math.floor(n*0.6));
    var blanks=1+Math.floor(Math.random()*maxB);
    blanks=Math.min(blanks,n-1); // keep at least 1 revealed letter
    var pos=shuffle([...Array(n).keys()]).slice(0,blanks);
    var pat=w.split('');
    for(var i=0;i<pos.length;i++) pat[pos[i]]='_';
    if(pat.includes('_')) return pat.join('').toUpperCase();
  }
  return 'W_RD';
}

function makeImpossible(){
  // Build a letter pattern that matches no dictionary word
  var letters='bcdfghjklmnpqrstvwxyz'; // consonant-heavy pool
  var vowels='aeiou';
  for(var att=0;att<500;att++){
    var len=3+Math.floor(Math.random()*4); // 3-6 chars
    var blanks=1+Math.floor(Math.random()*(len-1));
    var pat=[];
    for(var i=0;i<len;i++) pat.push('_');
    // fill non-blank positions with awkward consonant combos
    var revealed=[];
    for(var i=0;i<len-blanks;i++) revealed.push(i);
    revealed=shuffle(revealed);
    // pick consonant clusters unlikely to form words
    var clusters=['zx','qk','vk','bx','wq','fv','jx','kz','xz','vj',
                  'bq','cj','dx','fj','gx','hx','jz','kj','lx','mx',
                  'nj','px','qv','rj','sx','tj','vx','wx','yj','zj'];
    var cluster=clusters[Math.floor(Math.random()*clusters.length)];
    var ci=0;
    for(var i=0;i<revealed.length;i++){
      pat[revealed[i]]=cluster[ci%cluster.length].toUpperCase();
      ci++;
    }
    var str=pat.join('');
    if(findAnswers(str).length===0) return str;
  }
  // absolute fallback impossible pattern
  return 'Z_XK';
}

function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function findAnswers(pat){
  var re=new RegExp('^'+pat.toLowerCase().replace(/_/g,'[a-z]')+'$');
  return dict.filter(function(w){return re.test(w)});
}

function newPuzzle(){
  puzzle=makePuzzle();
  answers=findAnswers(puzzle);
  renderPuzzle();
}

function renderPuzzle(){
  var prefix=' '.repeat(tabLevel*TAB_SP);
  var sc=score>0?' +'+score:'';
  puzzleEl.textContent=prefix+puzzle+sc;
}

// ── Input ────────────────────────────────────────────────────
document.addEventListener('keydown',function(e){
  if(locked) return;
  var key=e.key.toUpperCase();
  if(key==='Y') handleAnswer(true);
  if(key==='N') handleAnswer(false);
});

function handleAnswer(userSaysYes){
  var hasWord=answers.length>0;
  var correct=(userSaysYes&&hasWord)||(!userSaysYes&&!hasWord);

  // log the puzzle line as history
  var prefix=' '.repeat(tabLevel*TAB_SP);
  var sc=score>0?' +'+score:'';
  log(prefix+puzzle+sc, correct?'green':'red');

  if(correct){
    score++;
    if(userSaysYes){
      var chosen=answers[Math.floor(Math.random()*answers.length)].toUpperCase();
      addAnswer('+ '+chosen);
    } else {
      addAnswer('- (none)');
    }
    tabLevel=Math.max(0,tabLevel-1);
    newPuzzle();
  } else {
    score=score-1;
    tabLevel++;
    if(tabLevel>=MAX_TABS){
      locked=true;
      puzzleEl.classList.add('flashing');
      setTimeout(function(){
        puzzleEl.classList.remove('flashing');
        puzzleEl.textContent='';
        advanceTitle();
      },900);
    } else {
      renderPuzzle();
    }
  }
}

function advanceTitle(){
  titleLines++;
  var logEl=document.getElementById('log');
  var lineH=Math.round(15*1.4);
  var available=Math.floor(logEl.clientHeight/lineH);
  if(titleLines>available){
    gameoverEl.style.display='flex';
    locked=true;
    return;
  }
  titleEl.textContent='irresolvable? [Y/N]'+'\n'.repeat(titleLines);
  tabLevel=0; locked=false;
  newPuzzle();
}

// ── Fallback ─────────────────────────────────────────────────
var FALLBACK=[
'horse','house','mouse','worse','curse','nurse','purse','verse','parse','chase',
'bend','band','bond','bind','fond','find','mind','wind','kind','land','hand','sand',
'card','cart','care','dare','dark','lark','bark','mark','park','hard','harm','farm',
'best','rest','test','nest','west','jest','pest','vest','zest','last','past','fast',
'cold','bold','gold','hold','mold','sold','told','fold','cord',
'light','night','fight','right','might','tight','sight','white',
'dream','cream','steam','seam','beam','team','ream','gleam',
'stone','tone','bone','cone','done','gone','lone','none','zone','hone','phone',
'start','smart','chart','heart','dart','part','tart','mart',
'green','greet','creek','creep','breed','freed','treed','steed','creed',
'flame','blame','frame','shame','tame','game','name','same','came','lame','fame',
'pride','bride','slide','glide','guide','tide','side','hide','wide','ride',
'cloud','proud','loud','shroud','crowd',
'brain','train','grain','drain','plain','main','pain','rain','vain','chain',
'smile','while','pile','mile','file','tile','bile','vile','rile',
'black','slack','crack','track','stack','snack','knack','hack','jack','rack',
'drive','strive','thrive','alive','hive','dive','live',
'place','space','grace','trace','brace','race','face','lace','pace','mace',
'break','steak','creak','freak','speak','sneak','weak','beak','leak','peak',
'world','swirl','twirl','girl','curl','hurl','furl','pearl','earl',
'plant','slant','grant','chant','rant','pant','cant','scan','plan','clan',
'watch','match','catch','hatch','patch','latch','batch',
'word','lord','ford','form','norm','dorm','worm','storm','born',
'field','yield','shield','wield','build','guild','child','mild','wild',
'groan','grown','brown','crown','frown','drown','known','blown','shown',
'think','drink','blink','brink','shrink','sink','link','rink','pink','wink',
'spare','share','stare','flare','glare','snare','bare','care','dare','fare',
'spade','blade','trade','grade','shade','made','wade','jade','fade','aide',
'flesh','fresh','mesh','bash','cash','clash','crash','dash','flash','trash',
'brook','crook','shook','took','look','book','cook','hook','nook','rook',
'steep','creep','sleep','sweep','deep','keep','jeep','weep','seep',
'bunch','munch','crunch','lunch','punch','hunch','chunk','dunk','bunk','funk',
'cling','fling','sling','bring','ring','sing','king','wing','thing','ding',
'brush','crush','blush','flush','gush','hush','lush','mush','rush',
'strip','drip','trip','grip','skip','ship','chip','dip','flip','hip',
'frost','cost','lost','post','most','host','ghost','boast','roast','toast',
'magic','major','maker','manor','march','match','mayor','media','mercy','merge',
'table','talon','taunt','thorn','three','threw','throw','thumb',
'valid','valor','valve','vapor','vault','video','vigor','viral','virus',
'wafer','waist','waltz','waste','water','weave','wedge','weigh','whale',
'yacht','yearn','yield','young','zeal','zebra','zippy','zesty'
];

loadDict();
</script>
</body>
</html>
